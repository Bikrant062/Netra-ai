<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netra AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Netra AI</h1>
    <p>A bilingual visual assistant. Point the camera and ask what is around you.</p>
  </header>

  <main>
    <section aria-label="Camera">
      <video id="camera" autoplay playsinline muted
             aria-label="Live camera view"></video>
      <button id="cameraBtn" type="button">Start camera</button>
    </section>

    <section aria-label="Ask a question">
      <form id="askForm">
        <label for="language">Language</label>
        <select id="language">
          <option value="en">English</option>
          <option value="ne">नेपाली (Nepali)</option>
        </select>

        <label for="question">Your question</label>
        <input id="question" type="text" value="What is in front of me?" autocomplete="off">
        <label class="check">
          <input id="facingMe" type="checkbox">
          The camera is facing me (swap left and right)
        </label>

        <button id="askBtn" type="submit">Ask</button>
      </form>
    </section>

    <p id="status" role="status" aria-live="polite">Camera is off.</p>
    <p id="answer" role="status" aria-live="polite"></p>
    <button id="repeatBtn" type="button" disabled>Repeat answer</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
